<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications — Virginia Tech Undergraduate Law Review</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --maroon: #861F41;
      --text: #1a1a1a;
      --muted: #4a4a4a;
      --light: #7a7a7a;
      --border: #dddddd;
      --offwhite: #faf8f4;
      --ink: #1a1a1a;
      --ink-muted: #4a4a4a;
      --ink-light: #7a7a7a;
      --rule: #c8b8a2;
      --rule-light: #e8e0d5;
      --cream: #faf8f4;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Newsreader', Georgia, serif;
      font-variation-settings: 'opsz' 12, 'wght' 300;
      background: var(--cream);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .page {
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    .seal {
      width: 64px;
      height: 64px;
      border: 1.5px solid var(--maroon);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }

    .rule-triple {
      width: 80px;
      margin: 0 auto 2.4rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .rule-triple span:nth-child(1),
    .rule-triple span:nth-child(3) { display: block; height: 1px; background: var(--rule); }
    .rule-triple span:nth-child(2) { display: block; height: 2px; background: var(--maroon); }

    .institution {
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--maroon);
      font-weight: 600;
      margin-bottom: 0.6rem;
    }

    .title {
      font-family: 'Newsreader', Georgia, serif;
      font-weight: 300;
      font-variation-settings: 'opsz' 48, 'wght' 300;
      font-size: 2.6rem;
      line-height: 1.15;
      color: var(--ink);
      letter-spacing: 0.01em;
      margin-bottom: 0.3rem;
    }

    .title strong {
      font-weight: 600;
      color: var(--maroon);
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--rule);
      margin: 1.8rem auto;
    }

    .body-text {
      font-size: 1.08rem;
      color: var(--ink-muted);
      line-height: 1.8;
    }

    .back-link {
      display: inline-block;
      margin-top: 2rem;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-light);
      text-decoration: none;
      border-bottom: 1px solid var(--rule-light);
      padding-bottom: 2px;
    }
    .back-link:hover { color: var(--maroon); border-color: var(--maroon); }

    .footer-note {
      margin-top: 3rem;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--rule);
    }

    @media (max-width: 860px) {
      .two-col { grid-template-columns: 1fr !important; gap: 40px !important; }
      .two-col-submit { grid-template-columns: 1fr !important; }
      .partners-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .media-grid { grid-template-columns: repeat(2, 1fr); }
      .blog-grid { grid-template-columns: repeat(2, 1fr); }
      .footer-grid { grid-template-columns: repeat(2, 1fr); }
      .page-header-inner { grid-template-columns: 1fr; gap: 32px; }
      .article-wrap { padding: 48px 24px; }
      .sticky-col { position: static; }

    }

    @media (max-width: 600px) {
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
      .container { padding: 0 16px; }
      .page-title { font-size: 2.2rem; }
      .page-header { padding: 32px 0 24px; }
      .media-grid { grid-template-columns: 1fr; }
      .blog-grid { grid-template-columns: 1fr; }
      .partners-grid { grid-template-columns: 1fr !important; }
      .footer-grid { grid-template-columns: 1fr; }
      .footer-grid { gap: 24px; }
      .hero-overlay { padding: 60px 16px 200px; }
      .board-photo-wrap { margin-top: -120px; padding: 0 16px; }
      .join-inner { flex-direction: column; align-items: flex-start; gap: 32px; }
      .post-wrap { padding: 40px 16px; }
      .post-title { font-size: 2rem; }
      .blog-grid { gap: 32px; }
      .page-header-inner { gap: 24px; }
      .section-join { padding: 48px 0; }
      .section-featured { padding: 48px 0; }

    }

    @media (max-width: 400px) {
      .page-title { font-size: 1.9rem; }
      .hero-title { font-size: 1.6rem !important; }
      nav { padding: 0 16px; }

    }
  </style>
</head>
<body>

  <div class="page">

    <div class="seal">
      <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" width="36" height="36">
        <text x="17" y="23" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="15" font-weight="600" fill="#861F41">VT</text>
      </svg>
    </div>

    <div class="institution">Virginia Tech Undergraduate Law Review</div>

    <h1 class="title">Our Print<br><strong>Journal</strong></h1>

    <div class="rule-triple">
      <span></span><span></span><span></span>
    </div>

    <p class="body-text">
      Our print journal is forthcoming. Virginia Tech&rsquo;s first undergraduate law review will publish rigorous student scholarship engaging with questions of law, policy, and justice.
    </p>

    <a href="/" class="back-link">← Return to Homepage</a>


  </div>


  <script>
    (function() {
      var btn = document.getElementById('nav-hamburger');
      var drawer = document.getElementById('nav-drawer');
      var overlay = document.getElementById('nav-drawer-overlay');
      var closeBtn = document.getElementById('nav-drawer-close');
      function open() { drawer.classList.add('open'); document.body.style.overflow = 'hidden'; }
      function close() { drawer.classList.remove('open'); document.body.style.overflow = ''; }
      if (btn) btn.addEventListener('click', open);
      if (overlay) overlay.addEventListener('click', close);
      if (closeBtn) closeBtn.addEventListener('click', close);
    })();
  </script>
</body>
</html>
